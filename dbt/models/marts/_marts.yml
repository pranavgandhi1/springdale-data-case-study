version: 2

models:
  - name: dim_agents
    description: "Agent dimension. One row per agent with name, email, birth date, and current age."
    columns:
      - name: agent_id
        tests:
          - unique
          - not_null
      - name: agent_name
        tests:
          - not_null
      - name: agent_email
      - name: agent_birth_date
      - name: agent_age_years

  - name: fct_tickets
    description: "Wide ticket fact table. One row per ticket with all derived calendar/quality fields and the assigned agent's attributes denormalized in. Primary source for ad-hoc Hex exploration and the source of every downstream aggregate mart."
    columns:
      - name: ticket_id
        tests:
          - unique
          - not_null
      - name: agent_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_agents')
                field: agent_id
              config:
                severity: warn
      - name: severity_level
        tests:
          - not_null
      - name: is_sla_breach
        description: "Flat 3-day SLA breach flag (resolution_time_days > 3), per the case study spec. Configurable via var sla_threshold_days."
        tests:
          - not_null

  - name: agg_severity_priority_mix
    description: "Ticket workload risk profile: count of tickets at each combination of severity and priority. Required KPI 1 from the case study spec."
    columns:
      - name: severity_label
        tests:
          - not_null
      - name: priority_label
        tests:
          - not_null
      - name: ticket_count
        tests:
          - not_null

  - name: agg_tickets_per_agent_per_week
    description: "Weekly resolution throughput per agent, computed on derived closed_date. Required KPI 2 from the case study spec."
    columns:
      - name: agent_id
        tests:
          - not_null
      - name: week_date
        tests:
          - not_null
      - name: tickets_resolved
        tests:
          - not_null

  - name: agg_resolution_by_category
    description: "Median, average, and 90th-percentile resolution time per request category, plus flat 3-day SLA breach rate. Required KPI 3 from the case study spec (interpreting 'issue type / category' as request_category since it has 4 values rather than 2)."
    columns:
      - name: request_category
        tests:
          - unique
          - not_null
      - name: ticket_count
        tests:
          - not_null
      - name: median_resolution_days
        tests:
          - not_null

  - name: agg_throughput_daily
    description: "Daily ticket throughput. One row per day in the dataset window. Tickets created, closed (using derived closed_date), and cumulative backlog."
    columns:
      - name: day_date
        tests:
          - unique
          - not_null
      - name: tickets_created
        tests:
          - not_null
      - name: tickets_closed
        tests:
          - not_null
      - name: cumulative_backlog

  - name: agg_resolution_by_severity
    description: "Resolution time distribution (p50/p90/p95) plus SLA breach rate per severity tier."
    columns:
      - name: severity_level
        tests:
          - unique
          - not_null
      - name: severity_label
        tests:
          - not_null
      - name: ticket_count
        tests:
          - not_null
      - name: sla_breach_rate_pct
        tests:
          - not_null

  - name: agg_agent_performance
    description: "Per-agent performance. Source for the Agent Performance Quadrants chart in Hex (volume + avg resolution + avg CSAT + SLA breach rate)."
    columns:
      - name: agent_id
        tests:
          - unique
          - not_null
      - name: tickets_handled
        tests:
          - not_null

  - name: agg_data_quality_weekly
    description: "Weekly data-quality scorecard. Trends % of tickets with unclassified severity, unassigned priority, missing CSAT, plus counts of severity-priority misalignment and zero resolution time."
    columns:
      - name: week_date
        tests:
          - unique
          - not_null
      - name: tickets_total
        tests:
          - not_null

  - name: agg_demand_mix
    description: "Demand decomposition by request category, issue type, and ticket prefix. Source for the demand heatmap."
    columns:
      - name: request_category
        tests:
          - not_null
      - name: issue_type
        tests:
          - not_null
      - name: tickets_total
        tests:
          - not_null
