name: 'springdale'
version: '1.0.0'
config-version: 2

profile: 'springdale'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  resolution_time_outlier_days: 90
  sla_threshold_days: 3

models:
  springdale:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  springdale:
    +schema: seeds
    +quote_columns: false
